<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Release Verification Ledger v2</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Space Grotesk',system-ui,sans-serif;background:#F3F5F1;color:#1B241F;padding:28px clamp(14px,4vw,44px) 60px;}
:root{--pass:#166E4F;--pass-bg:#E7F2ED;--fail:#B23B2A;--fail-bg:#F9ECE9;--warn:#96690F;--warn-bg:#F6EEDC;--acc:#265A70;--acc-bg:#E6EEF2;--line:#D9DFD7;--muted:#5D6862;--card:#fff;--mono:'IBM Plex Mono',monospace;}
.hd{border-bottom:2px solid #1B241F;padding-bottom:18px;}
.hd-eye{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
.hd-title{font-size:clamp(22px,3vw,36px);font-weight:700;}
.hd-v{font-size:11px;font-family:var(--mono);color:var(--acc);margin-left:10px;background:var(--acc-bg);padding:2px 8px;border-radius:10px;vertical-align:middle;}
.parts{display:flex;border-bottom:2px solid #1B241F;margin-bottom:22px;}
.pt{font-family:inherit;font-size:14px;font-weight:500;padding:11px 24px;background:none;border:none;border-bottom:3px solid transparent;cursor:pointer;color:var(--muted);margin-bottom:-2px;display:flex;flex-direction:column;gap:1px;}
.pt.on{color:#1B241F;border-bottom-color:var(--acc);}
.pt-lbl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;opacity:.65;}
.btn{font-family:inherit;font-size:13px;font-weight:500;padding:9px 15px;border:1.5px solid #1B241F;background:var(--card);color:#1B241F;cursor:pointer;border-radius:3px;}
.btn:hover:not(:disabled){background:var(--acc-bg);}
.btn:disabled{opacity:.35;cursor:not-allowed;}
.btn.ghost{border-color:var(--line);color:var(--muted);}
.rail{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-bottom:18px;}
.step{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:16px;display:flex;flex-direction:column;gap:9px;}
.step.done{border-color:var(--pass);box-shadow:inset 3px 0 0 var(--pass);}
.stag{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}
.stit{font-size:16px;font-weight:700;}
.snt{font-size:12px;line-height:1.5;color:var(--muted);}
.sld{font-size:11px;color:var(--pass);word-break:break-all;}
.row-g{display:flex;gap:7px;flex-wrap:wrap;}
.paste-a{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:3px;padding:7px;min-height:68px;resize:vertical;background:#FBFCFA;color:#1B241F;width:100%;}
.fld{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted);flex:1;}
.fld input{font-family:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--line);border-radius:3px;background:#FBFCFA;color:#1B241F;}
.fld.half{min-width:110px;}
.verd{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:22px;display:flex;align-items:center;gap:32px;flex-wrap:wrap;margin-bottom:14px;}
.stamp{border:3px double currentColor;border-radius:6px;padding:12px 20px;transform:rotate(-4deg);text-align:center;min-width:150px;}
.stamp.v{color:var(--pass);}.stamp.d{color:var(--fail);}
.sw{font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;}
.sr{font-family:var(--mono);font-size:13px;margin-top:2px;}
.vfs{display:flex;gap:28px;flex-wrap:wrap;flex:1;}
.vf{display:flex;flex-direction:column;}
.vfn{font-size:28px;font-weight:600;font-family:var(--mono);}
.vfn.f{color:var(--fail);}
.vfl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px;}
.chip{font-family:inherit;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 13px;font-size:12px;cursor:pointer;color:#1B241F;}
.chip.has-f{border-color:var(--fail);}
.chip.on{background:#1B241F;color:#F3F5F1;}
.ledger{background:var(--card);border:1px solid var(--line);border-radius:4px;overflow:hidden;margin-bottom:14px;}
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto;}
.tab{font-family:inherit;font-size:13px;padding:11px 16px;background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;color:var(--muted);white-space:nowrap;}
.tab.on{color:#1B241F;border-bottom-color:#1B241F;font-weight:600;}
.filters{display:flex;gap:10px;align-items:center;padding:10px 14px;flex-wrap:wrap;border-bottom:1px solid var(--line);}
.seg{display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden;}
.seg button{font-family:inherit;font-size:11px;padding:6px 10px;border:none;border-right:1px solid var(--line);background:var(--card);cursor:pointer;color:var(--muted);}
.seg button:last-child{border-right:none;}
.seg button.on{background:#1B241F;color:#F3F5F1;}
.srch{min-width:160px;font-family:inherit;font-size:12px;padding:7px 11px;border:1px solid var(--line);border-radius:3px;background:#FBFCFA;color:#1B241F;}
.cnt{font-size:11px;color:var(--muted);font-family:var(--mono);}
.tw{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:12.5px;}
table th{text-align:left;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:9px 13px;border-bottom:1px solid #1B241F;}
table td{padding:8px 13px;border-bottom:1px solid var(--line);vertical-align:top;}
.r{text-align:right;}
.tr-c{cursor:pointer;}
.tr-c:hover td{background:#F7F9F5;}
.tr-f td{background:var(--fail-bg);}
.met-n{font-weight:500;}
.met-id{font-size:10px;color:var(--muted);font-family:var(--mono);}
.badge{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:2px;white-space:nowrap;}
.b-pass{background:var(--pass-bg);color:var(--pass);}
.b-fail{background:var(--fail);color:#fff;}
.b-warn{background:var(--warn-bg);color:var(--warn);}
.b-muted{background:#EDEFEA;color:var(--muted);}
.det td{background:#FBFCFA;font-size:12px;padding:10px 16px;}
.det-row{display:flex;gap:10px;margin-bottom:5px;flex-wrap:wrap;}
.det-l{min-width:160px;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);}
.det-v{flex:1;font-family:var(--mono);font-size:11.5px;}
.idle{border:1.5px dashed var(--line);border-radius:4px;padding:30px;text-align:center;color:var(--muted);font-size:13px;margin-top:14px;}
.pg{display:flex;gap:12px;align-items:center;justify-content:center;padding:12px;font-size:12px;color:var(--muted);}
.cat-tb{display:flex;gap:8px;align-items:center;padding:10px 14px;flex-wrap:wrap;border-bottom:1px solid var(--line);}
.cat-sel{font-family:inherit;font-size:12px;padding:7px 10px;border:1px solid var(--line);border-radius:3px;background:#FBFCFA;color:#1B241F;}
.cat-mh{display:flex;align-items:center;gap:9px;padding:7px 14px;background:#F7F9F5;border-bottom:1.5px solid #1B241F;}
.cat-bq{font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:20px;font-weight:600;}
.cat-bq.q{background:var(--acc-bg);color:var(--acc);}
.cat-bq.y{background:var(--pass-bg);color:var(--pass);}
.fml{font-size:11px;color:var(--muted);}
.ban{padding:9px 12px;border-radius:3px;font-size:12px;display:flex;justify-content:space-between;gap:10px;margin-bottom:10px;}
.ban.err{background:var(--fail-bg);color:var(--fail);border:1px solid var(--fail);}
.bx{background:none;border:none;cursor:pointer;color:inherit;}
.t2-card{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:18px;margin-bottom:12px;}
.co-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:9px;margin-top:12px;}
.co-slot{border:1px solid var(--line);border-radius:4px;padding:13px;display:flex;align-items:flex-start;gap:9px;background:#F7F9F5;}
.co-slot.loaded{border-color:var(--pass);box-shadow:inset 3px 0 0 var(--pass);}
.co-slot.add-btn{flex-direction:column;align-items:center;justify-content:center;cursor:pointer;min-height:74px;font-family:inherit;font-size:12px;color:var(--muted);background:var(--card);border-style:dashed;}
.co-slot.add-btn:hover{background:var(--acc-bg);color:var(--acc);border-color:var(--acc);}
.co-slot.cfg{flex-direction:column;gap:8px;border-color:var(--acc);}
.co-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-top:3px;}
.co-dot-sm{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle;}
.co-info{flex:1;min-width:0;}
.co-name{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.co-meta{font-size:10.5px;color:var(--muted);margin-top:2px;font-family:var(--mono);}
.co-rm{background:none;border:none;cursor:pointer;color:var(--muted);font-size:14px;padding:0;}
.co-rm:hover{color:var(--fail);}
.co-in{font-family:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--line);border-radius:3px;width:100%;background:var(--card);color:#1B241F;}
.met-chips{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0;}
.mchip{font-family:inherit;font-size:12px;padding:5px 11px;border:1px solid var(--line);border-radius:20px;background:var(--card);cursor:pointer;display:flex;align-items:center;gap:5px;color:#1B241F;}
.mchip.sel{border-color:var(--acc);background:var(--acc-bg);color:var(--acc);}
.mchip:hover:not(.sel){background:#F7F9F5;}
.mfq{font-size:9px;letter-spacing:.07em;text-transform:uppercase;padding:1px 5px;border-radius:10px;font-weight:600;}
.mfq.q{background:var(--acc-bg);color:var(--acc);}
.mfq.y{background:var(--pass-bg);color:var(--pass);}
.t2-tog{display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden;}
.t2-tog button{font-family:inherit;font-size:12px;padding:6px 13px;border:none;background:var(--card);cursor:pointer;color:var(--muted);}
.t2-tog button.on{background:#1B241F;color:#F3F5F1;}
.anom-b{display:inline-block;background:var(--fail-bg);color:var(--fail);font-size:10px;font-weight:600;padding:2px 7px;border-radius:3px;margin-right:5px;}
.leg{display:flex;gap:14px;flex-wrap:wrap;padding:10px 14px 6px;font-size:11.5px;color:var(--muted);}
.leg-i{display:flex;align-items:center;gap:4px;}
.leg-sw{display:inline-block;width:11px;height:11px;border-radius:2px;border:1px solid rgba(0,0,0,.1);}
.ft{margin-top:36px;border-top:1px solid var(--line);padding-top:16px;font-size:12px;color:var(--muted);}
.ft-title{font-size:10px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px;color:#1B241F;}
.ft ul{margin:0;padding-left:18px;line-height:1.7;}
.ft li{margin-bottom:4px;}
.lc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:9px;margin-bottom:16px;}
.lc-card{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:14px;border-left:3px solid var(--muted);cursor:pointer;transition:box-shadow .1s;}
.lc-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.08);}
.lc-count{font-size:24px;font-weight:700;font-family:var(--mono);}
.lc-label{font-size:11px;color:var(--muted);margin-top:3px;}
.lc-badge{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:2px;color:#fff;white-space:nowrap;}
.lc-filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--card);border-radius:4px 4px 0 0;}
.lc-seg{display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden;flex-wrap:wrap;}
.lc-seg button{font-family:inherit;font-size:11px;padding:5px 10px;border:none;border-right:1px solid var(--line);background:var(--card);cursor:pointer;color:var(--muted);}
.lc-seg button:last-child{border-right:none;}
.lc-seg button.on{background:#1B241F;color:#F3F5F1;}
</style>
</head>
